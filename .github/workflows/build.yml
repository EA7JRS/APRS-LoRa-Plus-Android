name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13
      - name: Cache of the digital voice decoder build
        uses: actions/cache@v4
        with:
          path: build/dsd
          key: dsd-${{ hashFiles('native/dsd/**') }}
      - name: Digital voice decoder (dsd-fme, mbelib) for arm64-v8a and armeabi-v7a
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/dsd/build.sh arm64-v8a native/dsd/out/arm64-v8a
          native/dsd/build.sh armeabi-v7a native/dsd/out/armeabi-v7a
      - name: FT8 / FT4 decoder (ft8_lib) for arm64-v8a and armeabi-v7a
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/ft8/build.sh arm64-v8a native/ft8/out/arm64-v8a
          native/ft8/build.sh armeabi-v7a native/ft8/out/armeabi-v7a
      - name: WSPR decoder (wsprd) for arm64-v8a and armeabi-v7a
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/wspr/build.sh arm64-v8a native/wspr/out/arm64-v8a
          native/wspr/build.sh armeabi-v7a native/wspr/out/armeabi-v7a
      - name: FST4W decoder (port of WSJT-X) for arm64-v8a and armeabi-v7a
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          native/fst4w/build.sh arm64-v8a native/fst4w/out/arm64-v8a
          native/fst4w/build.sh armeabi-v7a native/fst4w/out/armeabi-v7a
      - name: Core checks (KISS, AX.25, APRS, messaging, iGate)
        run: gradle :core:selfTest --no-daemon
      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aprs-lora-plus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      # Google Play bundle: signed with the upload key from the repository secrets (ALP_UPLOAD_KEYSTORE = the .jks in base64,
      # ALP_UPLOAD_STORE_PASSWORD, ALP_UPLOAD_KEY_ALIAS, ALP_UPLOAD_KEY_PASSWORD). Without them this step is skipped.
      # -Palp.play=true leaves out the digital voice decoder (mbelib: possible DVSI patents).
      - name: Google Play bundle (signed .aab)
        env:
          ALP_UPLOAD_KEYSTORE: ${{ secrets.ALP_UPLOAD_KEYSTORE }}
          ALP_UPLOAD_STORE_PASSWORD: ${{ secrets.ALP_UPLOAD_STORE_PASSWORD }}
          ALP_UPLOAD_KEY_ALIAS: ${{ secrets.ALP_UPLOAD_KEY_ALIAS }}
          ALP_UPLOAD_KEY_PASSWORD: ${{ secrets.ALP_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$ALP_UPLOAD_KEYSTORE" ]; then
              # only base64 characters: a copy from Windows brings CR / LF, spaces or a BOM
              k=$(printf '%s' "$ALP_UPLOAD_KEYSTORE" | tr -dc 'A-Za-z0-9+/=')
              # a keystore is several kB: a short value means another secret (a password?) went into ALP_UPLOAD_KEYSTORE
              if [ ${#k} -lt 1000 ] || [ $(( ${#k} % 4 )) -ne 0 ]; then
                  echo "::error::ALP_UPLOAD_KEYSTORE is not the .jks in base64 (${#k} characters; it should be several thousand)"; exit 1
              fi
              printf '%s' "$k" | base64 -d > "$RUNNER_TEMP/upload.jks"
              export ALP_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          else
              echo "::notice::No upload key in the secrets: the bundle is built unsigned (only to check the release build)"
          fi
          gradle :app:bundleRelease -Palp.play=true --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
          [ -n "$ALP_UPLOAD_KEYSTORE" ] || rm -f app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: aprs-lora-plus-play-aab
          path: app/build/outputs/bundle/release/*.aab
